<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rural Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <h1>🌾 AI Rural Assistant</h1>
            </div>
            
            <div class="header-right">
                <!-- Language Toggle -->
                <div class="language-toggle">
                    <button id="langToggle" onclick="toggleLanguage()">
                        <span id="langText">हिं</span>
                    </button>
                </div>
                
                <!-- Voice Button -->
                <button class="icon-btn" onclick="toggleVoice()" id="voiceBtn">
                    🎤
                </button>
                
                <!-- Upload Button -->
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
                    📎
                </button>
                <input type="file" id="fileInput" style="display: none" onchange="uploadFile()">
                
                <!-- Profile Button -->
                <button class="icon-btn" onclick="toggleProfile()">
                    👤
                </button>
                
                <!-- Logout -->
                <button class="icon-btn" onclick="logout()">
                    🚪
                </button>
            </div>
        </header>
        
        <!-- Profile Sidebar -->
        <div id="profileSidebar" class="profile-sidebar">
            <div class="profile-content">
                <h2>प्रोफ़ाइल / Profile</h2>
                <div class="profile-info">
                    <p><strong>नाम / Name:</strong></p>
                    <input type="text" id="profileName" class="profile-input">
                    <p><strong>ईमेल / Email:</strong> <span id="profileEmail"></span></p>
                    <button onclick="updateProfile()" class="btn-primary">अपडेट / Update</button>
                </div>
                <button onclick="toggleProfile()" class="btn-secondary">बंद करें / Close</button>
            </div>
        </div>
        
        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2 id="welcomeText">नमस्ते! मैं आपकी मदद के लिए यहाँ हूँ। 🙏</h2>
                <p id="welcomeSubtext">कृपया अपना सवाल पूछें या मुझसे बात करें।</p>
            </div>
        </div>
        
        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="file-preview" id="filePreview" style="display: none;">
                <span id="fileName"></span>
                <button onclick="clearFile()">❌</button>
            </div>
            
            <div class="chat-input-wrapper">
                <textarea 
                    id="userInput" 
                    placeholder="अपना संदेश यहाँ लिखें... / Type your message here..."
                    rows="1"
                    onkeypress="handleKeyPress(event)"
                ></textarea>
                <button onclick="sendMessage()" class="send-btn">भेजें / Send</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
