<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रजिस्टर - AI Rural Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🌾 AI Rural Chatbot</h1>
            <h2>रजिस्टर करें / Register</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="नाम / Name" required>
                </div>
                
                <div class="form-group">
                    <input type="email" id="email" placeholder="ईमेल / Email" required>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" placeholder="पासवर्ड / Password" required>
                </div>
                
                <button type="submit" class="btn-primary">रजिस्टर / Register</button>
            </form>
            
            <p class="switch-form">
                पहले से अकाउंट है? / Already have account? 
                <a href="/login">लॉगिन करें / Login</a>
            </p>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, email, password })
            });
            
            const data = await response.json();
            const messageDiv = document.getElementById('message');
            
            if (data.success) {
                messageDiv.className = 'message success';
                messageDiv.textContent = data.message;
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                messageDiv.className = 'message error';
                messageDiv.textContent = data.message;
            }
        });
    </script>
</body>
</html>
